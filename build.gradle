plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def apiVersions = [
    '26.1': '0.155.3+26.1.2',
    '26.1.1': '0.155.3+26.1.2',
    '26.1.2': '0.155.3+26.1.2',
    '26.2': '0.161.0+26.2',
    '26.3': '0.165.2+26.3'
]
if (!apiVersions.containsKey(minecraft_version)) {
    throw new GradleException("Unsupported test version: ${minecraft_version}")
}
version = mod_version
group = 'dev.braian.villagermilkgrowth'
layout.buildDirectory = layout.projectDirectory.dir("build/${minecraft_version}")

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${apiVersions[minecraft_version]}"
}

processResources {
    inputs.property("version", project.version)
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'villager-milk-growth-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

// Adapt test API renames in 26.1 and particle packet records in 26.3.
// Production uses exactly the same source for every supported version.
def prepareGameTests = tasks.register('prepareGameTests', Sync) {
    from('src/gametest/java')
    into(layout.buildDirectory.dir('generated/gametest'))
    inputs.property('minecraft', minecraft_version)
    inputs.file('build.gradle')
    if (minecraft_version.startsWith('26.1')) {
        filter { line -> line.replace('EntityTypes', 'EntityType').replace('mc.gui.screen()', 'mc.screen').replace('mundo.getConnection().waitForChunksRender()', 'mundo.getClientLevel().waitForChunksRender()') }
    }
    if (minecraft_version == '26.3') {
        filter { line -> line.replace('packet.getParticle()', 'packet.particle()').replace('packet.getCount()', 'packet.count()') }
    }
}
sourceSets.gametest.java.setSrcDirs([prepareGameTests, minecraft_version.startsWith('26.1') ? 'src/test-support/26.1' : 'src/test-support/26.2'])
jar {
    from('LICENSE')
}




// Test the distributable itself, without loading freshly compiled production classes.
if (providers.gradleProperty('testJar').isPresent()) {
    def artifact = file(providers.gradleProperty('testJar').get())
    sourceSets.gametest.compileClasspath -= sourceSets.main.output
    sourceSets.gametest.runtimeClasspath = (sourceSets.gametest.runtimeClasspath - sourceSets.main.output) + files(artifact)
    ['gameTest', 'clientGameTest'].each { name ->
        loom.runs.named(name) {
            systemProperties.put('villagerMilkGrowth.testJar', artifact.absolutePath)
            systemProperties.put('villagerMilkGrowth.testSha256', providers.gradleProperty('testSha256').get())
        }
    }
}